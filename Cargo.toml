[package]
name = "snac3"
version = "0.1.0"
edition = "2024"

[[bin]]
doctest = false
name = "snac3"
test = false

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.8", features = ["macros"] }
axum-template = { version = "3.0.0", features = ["minijinja"] }
minijinja = { version = "2.18.0", features = ["loader"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.50.0", features = ["rt-multi-thread", "net", "macros"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
